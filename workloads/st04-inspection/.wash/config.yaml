build:
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/st04_inspection.wasm

# The binding: the handler subscription, the grant (subscription + DLQ +
# every produce target + line.metrics), the required group id and DLQ.
workload:
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - handler
        - producer
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        handler.topics: inspect.jobs
        topics: inspect.jobs,inspect.dlq,inspect.results,line.metrics
        handler.group.id: st04-inspection
        auto.offset.reset: earliest
        dead-letter.topic: inspect.dlq
        # One job per call: a verdict per job (the work-queue shape).
        handler.batch.size: "1"
