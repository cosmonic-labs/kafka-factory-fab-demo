build:
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module. The named `transaction:` import needs the linker shim
  # in .cargo/ (wasm-component-ld >= 0.5.27 on PATH).
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/st06_final_test.wasm

# ST-06's two bindings: the unnamed [consumer] (its group; auto-commit off,
# offsets travel in the transaction) and the named [transaction] binding the
# world imports as `transaction:` (a stable transactional.id; the grant
# covers every output AND the input whose offsets it enlists).
workload:
  environment:
    config:
      IN_TOPIC: finaltest.bins
      OUT_TOPIC: lot.disposition
      MOVES_TOPIC: inventory.moves
      BATCH_SIZE: "100"
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - consumer
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: finaltest.bins
        consumer.group.id: st06-final-test
        auto.offset.reset: earliest
        enable.auto.commit: "false"
    - name: transaction
      namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - transaction
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: finaltest.bins,lot.disposition,inventory.moves,line.metrics
        transactional.id: st06-final-test-txn-1
        transaction.group.id: st06-final-test
