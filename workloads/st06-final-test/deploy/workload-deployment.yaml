apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: "st06-final-test"
  namespace: default
spec:
  # Each live replica needs a distinct stable transactional.id.
  replicas: 1
  template:
    spec:
      service:
        # Prebuilt from this template; swap for your own registry once you
        # change the source. Pin a `sha-<commit>` tag if you need one image.
        image: ghcr.io/cosmonic-labs/kafka-templates/kafka-transactional:latest
        maxRestarts: 100
        localResources:
          environment:
            config:
              IN_TOPIC: finaltest.bins
              OUT_TOPIC: lot.disposition
              MOVES_TOPIC: inventory.moves
              BATCH_SIZE: "100"
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [consumer]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "finaltest.bins"
            consumer.group.id: "st06-final-test"
            auto.offset.reset: earliest
            enable.auto.commit: "false"
        - name: transaction
          namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [transaction]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "finaltest.bins,lot.disposition,inventory.moves,line.metrics"
            transactional.id: "st06-final-test-txn-1"
            transaction.group.id: "st06-final-test"
