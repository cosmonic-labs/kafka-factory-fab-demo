apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: "fab-st06-final-test-twin"
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      service:
        # Prebuilt from this template; swap for your own registry once you
        # change the source. Pin a `sha-<commit>` tag if you need one image.
        image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
        maxRestarts: 100
        localResources:
          environment:
            config:
              IN_TOPIC: finaltest.bins
              OUT_TOPIC: lot.disposition.twin
              MOVES_TOPIC: inventory.moves.twin
                            BATCH_SIZE: "100"
              COMMIT_EVERY: "5"
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [consumer, producer]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "finaltest.bins,lot.disposition.twin,inventory.moves.twin,line.metrics"
            consumer.group.id: "st06-final-test-twin"
            auto.offset.reset: earliest
            enable.auto.commit: "false"
