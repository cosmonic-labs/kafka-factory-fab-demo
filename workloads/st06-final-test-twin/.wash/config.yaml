build:
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/st06_final_test_twin.wasm

# The twin's binding: its own group over the same input, the host-owned
# producer, and a grant for the twin ledger topics and line.metrics.
workload:
  environment:
    config:
      IN_TOPIC: finaltest.bins
      OUT_TOPIC: lot.disposition.twin
      MOVES_TOPIC: inventory.moves.twin
      BATCH_SIZE: "100"
      COMMIT_EVERY: "5"
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - consumer
        - producer
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: finaltest.bins,lot.disposition.twin,inventory.moves.twin,line.metrics
        consumer.group.id: st06-final-test-twin
        auto.offset.reset: earliest
        enable.auto.commit: "false"
