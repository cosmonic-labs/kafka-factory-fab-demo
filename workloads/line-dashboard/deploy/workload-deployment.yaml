apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: "line-dashboard"
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      components:
        - name: processor
          # Prebuilt from this template; swap for your own registry once you
          # change the source. Pin a `sha-<commit>` tag if you need one image.
          image: ghcr.io/cosmonic-labs/kafka-templates/kafka-handler-consumer:latest
          # Instances scale with assigned partition work and return to zero.
          poolSize: 32
          maxConcurrency: 1
          reclaimWindowSeconds: 30
          reclaimMinInstances: 0
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [handler]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            # The subscription: line.metrics, the DLQs it counts, the two ledgers.
            handler.topics: "line.metrics,dieattach.dlq,wirebond.dlq,inspect.dlq,mold.dlq,lot.disposition,lot.disposition.twin"
            # The GRANT: every subscription plus this handler's own DLQ.
            topics: "line.metrics,line.metrics.dlq,dieattach.dlq,wirebond.dlq,inspect.dlq,mold.dlq,lot.disposition,lot.disposition.twin"
            handler.group.id: "line-dashboard"
            auto.offset.reset: earliest
            dead-letter.topic: "line.metrics.dlq"
            # Tape & Reel reads the transactional ledger read_committed; so does this.
            isolation.level: read_committed
