[package]
name = "st05-mold-cure"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.58.0", features = ["macros", "async-spawn", "inter-task-wakeup"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
