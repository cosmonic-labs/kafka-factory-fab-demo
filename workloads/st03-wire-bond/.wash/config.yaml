build:
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/st03_wire_bond.wasm

# ST-03's binding: one consumer session (its own group and commit policy)
# and the host-owned producer; the grant covers input, output, DLQ and
# line.metrics. The env contract is the scaffold's plus the NSOP threshold.
workload:
  environment:
    config:
      IN_TOPIC: wirebond.raw
      OUT_TOPIC: wirebond.metrics
      DLQ_TOPIC: wirebond.dlq
      BATCH_SIZE: "100"
      NSOP_THRESHOLD_PCT: "15"
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - consumer
        - producer
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: wirebond.raw,wirebond.metrics,wirebond.dlq,line.metrics
        consumer.group.id: st03-wire-bond
        auto.offset.reset: earliest
        enable.auto.commit: "false"
