build:
  # wasm32-wasip2 is required: `cosmonic:kafka@0.5.0`'s functions are all
  # `async func`, which needs the p3 bindings wit-bindgen generates on top of
  # a p2 core module.
  command: cargo build --target wasm32-wasip2 --release
  component_path: target/wasm32-wasip2/release/factory_simulator.wasm

# The factory simulator's binding: one consumer session on sim.control and
# the host-owned producer for every input topic plus line.metrics. The grant
# lists every topic it touches; the broker lives here, never in the code.
workload:
  allowedHosts: []
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: "0.5.0"
      interfaces:
        - consumer
        - producer
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: sim.control,probe.lots,dieattach.readings,wirebond.raw,inspect.jobs,mold.telemetry,finaltest.bins,line.metrics
        consumer.group.id: factory-simulator
        auto.offset.reset: latest
        enable.auto.commit: "false"
