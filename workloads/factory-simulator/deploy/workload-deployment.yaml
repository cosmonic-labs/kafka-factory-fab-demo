apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: "fab-factory-simulator"
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      service:
        # Prebuilt from this template; swap for your own registry once you
        # change the source. Pin a `sha-<commit>` tag if you need one image.
        image: ghcr.io/cosmonic-labs/kafka-templates/kafka-pull-service:latest
        maxRestarts: 100
        localResources:
          allowedHosts: []
      hostInterfaces:
        - namespace: cosmonic
          package: kafka
          version: 0.5.0
          interfaces: [consumer, producer]
          config:
            bootstrap.servers: my-kafka.kafka.svc.cluster.local:9092
            broker.address.family: v4
            topics: "sim.control,probe.lots,dieattach.readings,wirebond.raw,inspect.jobs,mold.telemetry,finaltest.bins,line.metrics"
            consumer.group.id: "factory-simulator"
            auto.offset.reset: latest
            enable.auto.commit: "false"
