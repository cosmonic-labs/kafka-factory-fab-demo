# Single-node Redpanda for the Fab 3 line. Kafka API on 127.0.0.1:9092 (what
# every manifest's bootstrap.servers names), rpk inside the container
# (scripts/lib.sh runs it with `docker compose exec`). Data lives in a named
# volume so `docker compose restart redpanda` (demo beat 6) keeps the topics;
# `scripts/down.sh --purge` removes it.
name: fab3
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    container_name: fab3-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://127.0.0.1:9092
      - --rpc-addr
      - 127.0.0.1:33145
      - --advertise-rpc-addr
      - 127.0.0.1:33145
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  redpanda:
