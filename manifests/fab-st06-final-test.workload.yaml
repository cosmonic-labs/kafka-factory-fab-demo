apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st06-final-test"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st06-final-test
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st06
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        topics: "finaltest.bins"
        consumer.group.id: "st06-final-test"
        auto.offset.reset: earliest
        # Offsets travel in the transaction.
        enable.auto.commit: "false"
    - name: transaction
      namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [transaction]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # The output topics AND every input topic whose offsets it enlists;
        # line.metrics because this station's metrics ride in the transaction.
        topics: "finaltest.bins,lot.disposition,inventory.moves,line.metrics"
        # One STABLE id per live instance — never more than one replica.
        transactional.id: "st06-final-test-txn-1"
        transaction.group.id: "st06-final-test"
  # A wasi:cli/run component runs as the workload's long-running service
  # (Desktop drives `run` only under spec.service; docs/DECISIONS.md).
  service:
    name: final-test
    image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st06-final-test:0.1.0@sha256:23b0800da7d2f1e7f2db89ac2574737ed8a98b62bb32cf53e688b64ee4993cc7
    maxRestarts: 100
    localResources:
      environment:
        config:
          IN_TOPIC: finaltest.bins
          OUT_TOPIC: lot.disposition
          MOVES_TOPIC: inventory.moves
          BATCH_SIZE: "100"
      allowedHosts: []
  # Desktop's Workload schema requires at least one component; this entry is
  # never invoked (the service above is what runs). replicas stays 1.
  components:
    - name: final-test
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st06-final-test:0.1.0@sha256:23b0800da7d2f1e7f2db89ac2574737ed8a98b62bb32cf53e688b64ee4993cc7
      localResources:
        allowedHosts: []
