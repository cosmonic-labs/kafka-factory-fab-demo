# Reach it at http://fab-st01-probe-intake.localhost:8200/
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st01-probe-intake"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st01-probe-intake
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st01
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      # This component exports P3 wasi:http/handler@0.3.0 — bind "handler",
      # which is also what makes poolSize/maxConcurrency effective.
      interfaces: [handler]
      config:
        host: "fab-st01-probe-intake.localhost"
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [producer]
      config:
        # The binding fixes the producer's connection and policy.
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # Grant: which topics this workload may produce to.
        topics: "probe.lots,line.metrics"
  components:
    - name: intake
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st01-probe-intake:0.1.0@sha256:25da5d6afd084e058a8761bf15ff3dc2327e4498e9104bde2d2458212aff2aa8
      poolSize: 4
      localResources:
        allowedHosts: []
