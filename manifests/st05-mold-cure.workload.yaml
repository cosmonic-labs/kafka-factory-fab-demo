apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "st05-mold-cure"
  namespace: default
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [handler, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # The host subscribes to and dispatches this topic.
        handler.topics: "mold.telemetry"
        # The GRANT: the subscription, the DLQ, and every produce target.
        topics: "mold.telemetry,mold.dlq,mold.profile,line.metrics"
        # This stable group resumes offsets across redeploys.
        handler.group.id: "st05-mold-cure"
        auto.offset.reset: earliest
        dead-letter.topic: "mold.dlq"
        # One batch of one partition is one window (the stream-processor stand-in).
        handler.batch.size: "1000"
        # A long window wants the poll interval, not a smaller pool.
        max.poll.interval.ms: "900000"
  components:
    - name: cure-profile
      image: oci.localhost:8200/apps/st05-mold-cure:0.1.0@sha256:fa0a06e96a01517c3b1e9ae16224870baa3ddcfc4ca4fcb987389e801fb9d9b7
      # Instances scale with assigned partition work and return to zero.
      poolSize: 32
      maxConcurrency: 1
      reclaimWindowSeconds: 30
      reclaimMinInstances: 0
      localResources:
        allowedHosts: []
