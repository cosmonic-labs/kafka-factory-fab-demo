# Demo beat 2: a manifest that sets a HOST-ONLY key. Desktop refuses it at
# apply (and `POST /v1/workloads/validate` says the same) with a sentence
# that names the key, never a value. Never applies.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st07-refused-host-only"
  namespace: default
  labels:
    app.kubernetes.io/part-of: fab-factory
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [handler]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        handler.topics: "dieattach.readings"
        topics: "dieattach.readings,dieattach.dlq"
        handler.group.id: "st07-refused"
        dead-letter.topic: "dieattach.dlq"
        # Loads native code into the daemon process: host-only, refused.
        plugin.library.paths: "monitoring-interceptor"
  components:
    - name: processor
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st02-die-attach:0.1.0
      localResources:
        allowedHosts: []
