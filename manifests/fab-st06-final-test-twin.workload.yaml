apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st06-final-test-twin"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st06-final-test-twin
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st06-twin
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # Grant every topic the service touches: input, the twin ledger, metrics.
        topics: "finaltest.bins,lot.disposition.twin,inventory.moves.twin,line.metrics"
        consumer.group.id: "st06-final-test-twin"
        auto.offset.reset: earliest
        enable.auto.commit: "false"
  # A wasi:cli/run component runs as the workload's long-running service
  # (Desktop drives `run` only under spec.service; docs/DECISIONS.md).
  service:
    name: final-test-twin
    image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st06-final-test-twin:0.1.0@sha256:ea2acfa4d226a8752d772aba63370cfb6eab9e6db64f6c08d0e5920fa15239e5
    maxRestarts: 100
    localResources:
      environment:
        config:
          IN_TOPIC: finaltest.bins
          OUT_TOPIC: lot.disposition.twin
          MOVES_TOPIC: inventory.moves.twin
          BATCH_SIZE: "100"
          # Commit only every 5 batches: the at-least-once replay window the
          # broker-restart beat makes visible.
          COMMIT_EVERY: "5"
      allowedHosts: []
  # Desktop's Workload schema requires at least one component; this entry is
  # never invoked (the service above is what runs).
  components:
    - name: final-test-twin
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st06-final-test-twin:0.1.0@sha256:ea2acfa4d226a8752d772aba63370cfb6eab9e6db64f6c08d0e5920fa15239e5
      localResources:
        allowedHosts: []
