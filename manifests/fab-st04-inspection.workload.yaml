apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st04-inspection"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st04-inspection
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st04
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [handler, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # The host subscribes to and dispatches this topic.
        handler.topics: "inspect.jobs"
        # The GRANT: the subscription, the DLQ, and every produce target.
        topics: "inspect.jobs,inspect.dlq,inspect.results,line.metrics"
        # This stable group resumes offsets across redeploys.
        handler.group.id: "st04-inspection"
        auto.offset.reset: earliest
        dead-letter.topic: "inspect.dlq"
        # One job per call: a verdict per job (the work-queue shape).
        handler.batch.size: "1"
  components:
    - name: inspector
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st04-inspection:0.1.0@sha256:7074922d36ae07d5cd81a1ee2b53542925bda7508ef6aae4ec70f4dc1266af3b
      # Instances scale with assigned partition work and return to zero.
      poolSize: 32
      maxConcurrency: 1
      reclaimWindowSeconds: 30
      reclaimMinInstances: 0
      localResources:
        allowedHosts: []
