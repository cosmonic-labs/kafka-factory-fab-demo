apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st02-die-attach"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st02-die-attach
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st02
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [handler, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # The host subscribes to and dispatches this topic.
        handler.topics: "dieattach.readings"
        # The GRANT: the subscription, the DLQ, and every produce target.
        topics: "dieattach.readings,dieattach.dlq,dieattach.flags,line.metrics"
        # This stable group resumes offsets across redeploys.
        handler.group.id: "st02-die-attach"
        auto.offset.reset: earliest
        dead-letter.topic: "dieattach.dlq"
  components:
    - name: processor
      image: ghcr.io/cosmonic-labs/kafka-factory-fab-demo/fab-st02-die-attach:0.1.0@sha256:d7756e94da56fc4f32801408c7c4680c0927c9b53830d8f39e9faa1bb806a5e5
      # Instances scale with assigned partition work and return to zero.
      poolSize: 32
      maxConcurrency: 1
      reclaimWindowSeconds: 30
      reclaimMinInstances: 0
      localResources:
        allowedHosts: []
