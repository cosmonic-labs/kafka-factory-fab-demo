apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fab-st03-wire-bond"
  namespace: default
  # Tags: the Workloads grid searches label keys and values, so "fab-factory"
  # (or "station=st02") filters the line's workloads on screen.
  labels:
    app.kubernetes.io/part-of: fab-factory
    app.kubernetes.io/name: fab-st03-wire-bond
    app.kubernetes.io/version: "0.1.0"
    fab.meridian.example/station: st03
spec:
  hostInterfaces:
    - namespace: cosmonic
      package: kafka
      version: 0.5.0
      interfaces: [consumer, producer]
      config:
        bootstrap.servers: 127.0.0.1:9092
        broker.address.family: v4
        # Grant every topic the service touches: input, output, DLQ, metrics.
        topics: "wirebond.raw,wirebond.metrics,wirebond.dlq,line.metrics"
        consumer.group.id: "st03-wire-bond"
        auto.offset.reset: earliest
        enable.auto.commit: "false"
  # A wasi:cli/run component runs as the workload's long-running service
  # (Desktop drives `run` only under spec.service; docs/DECISIONS.md).
  service:
    name: wire-bond
    image: oci.localhost:8200/apps/fab-st03-wire-bond:0.1.0@sha256:f9402917ad24855fc0b8894b4e314ba7bbe164d61e0aa70eb08390afa430c1d5
    maxRestarts: 100
    localResources:
      environment:
        config:
          IN_TOPIC: wirebond.raw
          OUT_TOPIC: wirebond.metrics
          DLQ_TOPIC: wirebond.dlq
          BATCH_SIZE: "100"
          # Beat 7: re-publish with a tighter value and the stable group
          # resumes where the old instance stopped.
          NSOP_THRESHOLD_PCT: "15"
      allowedHosts: []
  # Desktop's Workload schema requires at least one component; this entry is
  # never invoked (the service above is what runs).
  components:
    - name: wire-bond
      image: oci.localhost:8200/apps/fab-st03-wire-bond:0.1.0@sha256:f9402917ad24855fc0b8894b4e314ba7bbe164d61e0aa70eb08390afa430c1d5
      localResources:
        allowedHosts: []
